<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F6EF">
<title>ATHAR — Graduation Project 2026</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:#f7f6ef}
body{margin:0;background:#f7f6ef;font-family:Inter,"Segoe UI",Arial,sans-serif;color:#2f352b}
.artboard{position:relative;width:min(100%,428px);margin:0 auto;background:#f7f6ef;box-shadow:0 0 42px rgba(54,66,38,.08)}
.artboard>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.overlay{position:absolute;inset:0;pointer-events:none}
.hotspot{position:absolute;pointer-events:auto;cursor:pointer;border-radius:10px;background:rgba(90,108,55,0);transition:.15s}
.hotspot:hover{background:rgba(90,108,55,.08)}
.linkedin:hover{background:rgba(10,102,194,.08)}

#backdrop{position:fixed;inset:0;display:none;background:rgba(29,37,23,.42);backdrop-filter:blur(3px);z-index:100}
#backdrop.show{display:block}
#sheet{position:fixed;left:50%;bottom:14px;width:min(94vw,430px);max-height:82vh;overflow:auto;z-index:101;
transform:translate(-50%,115%);transition:.28s ease;background:#fbfaf5;border:1px solid #e0e5d7;border-radius:24px;
box-shadow:0 24px 80px rgba(36,48,24,.30)}
#sheet.show{transform:translate(-50%,0)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px 10px}
.sheet-head b{font-size:18px}
.close{border:1px solid #dfe4d5;background:#fff;width:34px;height:34px;border-radius:50%;font-size:19px;cursor:pointer}
.sheet-body{padding:0 18px 20px;color:#6c7465;font-size:13px;line-height:1.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
.kpi{background:white;border:1px solid #e3e7dc;border-radius:14px;padding:12px}
.kpi span{display:block;font-size:10px;color:#899080;margin-bottom:4px}
.kpi b{font-size:17px;color:#657741}
.menu{display:grid;gap:8px}
.menu button{text-align:left;background:#fff;border:1px solid #e3e7da;border-radius:13px;padding:12px 13px;color:#3d4634;font-weight:700;cursor:pointer}
.action{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:#65783e;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer;margin-top:12px}
.trust-number{font-size:54px;font-weight:850;color:#d9362b;line-height:1}
.trust-range{width:100%;accent-color:#d9362b;margin:20px 0 10px}
.trust-state{display:inline-block;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:800;background:#fee9e7;color:#d9362b}
.sim-step{padding:9px 0;border-bottom:1px solid #eceee7;opacity:.25;transition:.25s}
.sim-step.on{opacity:1;color:#445534} .sim-step.bad.on{color:#c94b46} .sim-step.warn.on{color:#b57b19} .sim-step.good.on{color:#3e8e58}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);opacity:0;pointer-events:none;z-index:105;
background:#303b22;color:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 14px 42px rgba(33,43,24,.28);
font-weight:700;font-size:13px;text-align:center;transition:.2s;max-width:90vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.artboard{margin:20px auto;border-radius:22px;overflow:hidden}}
</style>
</head>

<script>
const ART_H=13404;
const zoneData={
  energy:{name:'Energy Zone',score:91,state:'Trusted',devices:24,threats:0,desc:'Power grid, solar farms, wind turbines, substations.'},
  mobility:{name:'Mobility Zone',score:78,state:'Degraded',devices:'—',threats:'—',desc:'Connected transportation and smart mobility infrastructure.'},
  safety:{name:'Safety Zone',score:85,state:'Trusted',devices:'—',threats:'—',desc:'Public-safety sensors, monitoring systems and emergency infrastructure.'},
  water:{name:'Water Zone',score:11,state:'Untrusted',devices:'—',threats:'Active',desc:'Water sensor WS-014 is the active compromised device used in the attack simulation.'},
  buildings:{name:'Buildings Zone',score:88,state:'Trusted',devices:'—',threats:'—',desc:'Connected building systems and smart facility controls.'},
  oilgas:{name:'Oil & Gas Zone',score:34,state:'Frozen',devices:'—',threats:'—',desc:'Industrial smart-city assets currently operating under a frozen trust state.'}
};
const steps={
1:['STEP 01 · Data Collection','ATHAR ingests telemetry from smart city devices, sensors, controllers, and IoT systems across all six zones.','142 devices · 6 zones · Real-time streams'],
2:['STEP 02 · Behavioral Analysis','Incoming telemetry is compared with learned behavioral baselines to identify abnormal values, rate changes, and deviations.','Behavioral baseline + anomaly detection'],
3:['STEP 03 · Trust Evaluation','ATHAR calculates dynamic per-device trust scores and aggregates them across zones and the entire system.','0–100 continuous trust scoring'],
4:['STEP 04 · Security Response','ATHAR applies proportional security responses according to trust level, device criticality, and zone context.','Monitor → Alert → Freeze → Quarantine']
};
const mitre={
T0812:['T0812 · Default Credentials','Unauthenticated MQTT Publish','The attacker exploits default or absent credentials on the MQTT broker to publish unauthorized commands to connected IoT devices.'],
T0855:['T0855 · Unauthorized Command','Control Command Injection','Unauthorized commands are issued to connected smart-city control components.'],
T0856:['T0856 · Spoof Reporting Message','Sensor Data Forgery','The attacker sends false sensor reports so operational systems receive manipulated values.'],
T0831:['T0831 · Manipulation of Control','Automated System Override','The attack attempts to manipulate connected control logic or automated system behavior.']
};
function scrollToY(y){
  const a=document.getElementById('artboard');
  const top=window.scrollY+a.getBoundingClientRect().top+(y/ART_H)*a.offsetHeight;
  window.scrollTo({top:Math.max(0,top-8),behavior:'smooth'});
}
function openSheet(title,body){
  document.getElementById('sheetTitle').textContent=title;
  document.getElementById('sheetBody').innerHTML=body;
  document.getElementById('backdrop').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet(){document.getElementById('backdrop').classList.remove('show');document.getElementById('sheet').classList.remove('show')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.remove('show'),2200)}
function openMenu(){
 const items=[['Explore the City',944],['How ATHAR Works',1858],['Trust Scale',2599],['Attack Simulation',3415],['MITRE ATT&CK ICS',4520],['Sentinel Dashboard',6033],['Incident Response',6434],['Human in the Loop',7358],['Digital Evidence Chain',8317],['System Architecture',9472],['Key Capabilities',10640],['Before & After ATHAR',12130]];
 openSheet('ATHAR Navigation','<div class="menu">'+items.map(x=>`<button onclick="closeSheet();scrollToY(${x[1]})">${x[0]}</button>`).join('')+'</div>');
}
function showZone(id){const z=zoneData[id];openSheet(z.name,`<div>${z.desc}</div><div class="grid"><div class="kpi"><span>Trust Score</span><b>${z.score}</b></div><div class="kpi"><span>State</span><b>${z.state}</b></div><div class="kpi"><span>Devices</span><b>${z.devices}</b></div><div class="kpi"><span>Threats</span><b>${z.threats}</b></div></div>`)}
function showStep(n){const s=steps[n];openSheet(s[0],`<div>${s[1]}</div><div style="margin-top:12px;font-weight:800;color:#536236">${s[2]}</div>`)}
function openTrust(){
 openSheet('Interactive Trust Scale',`<div class="trust-number" id="trustNum">16</div><span class="trust-state" id="trustState">CRITICAL</span><input class="trust-range" id="trustRange" type="range" min="0" max="100" value="16" oninput="changeTrust(this.value)"><div id="trustDesc">Device isolated from network. Forensic analysis initiated. Incident created.</div>`);
}
function changeTrust(v){
 v=Number(v);const num=document.getElementById('trustNum'),st=document.getElementById('trustState'),d=document.getElementById('trustDesc');
 num.textContent=v;
 let name,color,bg,desc;
 if(v>=80){name='TRUSTED';color='#158a55';bg='#e8f5ec';desc='Device operating normally. Continuous monitoring remains active.'}
 else if(v>=50){name='CAUTION';color='#668b34';bg='#eff6df';desc='Trust is reduced. Additional monitoring and alerting are activated.'}
 else if(v>=20){name='HIGH RISK';color='#bd8612';bg='#fff3ce';desc='Automation is suspended and human verification is required.'}
 else{name='CRITICAL';color='#d9362b';bg='#fee9e7';desc='Device isolated from network. Forensic analysis initiated. Incident created.'}
 num.style.color=color;st.textContent=name;st.style.color=color;st.style.background=bg;d.textContent=desc;
}
function runSimulation(){
 openSheet('Attack Simulation Console',`<div id="sim"><div class="sim-step warn">⚡ Abnormal Data Detected — MQTT payload rate reaches 47× normal.</div><div class="sim-step bad">● Behavioral Deviation Flagged — Z-score 6.2σ from baseline.</div><div class="sim-step bad">● Trust Score Drops — 91 → 74 → 48 → 23 → 11.</div><div class="sim-step warn">● Device Identified — WS-014 mapped to MITRE T0812.</div><div class="sim-step good">● Device Quarantined — automated actions suspended.</div><div class="sim-step good">● Evidence Chain Updated.</div><div class="sim-step good">✓ Incident Contained — IR-2024-047 created.</div></div><button class="action" onclick="animateSim()">Run Again</button>`);
 setTimeout(animateSim,220);
}
function animateSim(){const a=[...document.querySelectorAll('#sim .sim-step')];a.forEach(e=>e.classList.remove('on'));a.forEach((e,i)=>setTimeout(()=>e.classList.add('on'),i*400))}
function showMitre(id){const m=mitre[id];openSheet(m[0],`<div style="font-weight:800;color:#536236;margin-bottom:8px">${m[1]}</div><div>${m[2]}</div>`)}
function approveRecovery(){openSheet('Human-in-the-Loop Recovery',`<div>Device <b>WS-014</b> is awaiting operator approval for recovery.</div><div class="grid"><div class="kpi"><span>Device</span><b>WS-014</b></div><div class="kpi"><span>Trust Score</span><b>11</b></div></div><button class="action" onclick="closeSheet();toast('Recovery approval recorded in the evidence chain ✓')">Approve Recovery</button>`)}
function showCompare(mode){
 if(mode==='without')openSheet('Without ATHAR','Device data may be accepted without continuous trust validation. Identifying untrusted devices can be slow, compromised data may silently affect city decisions, and incident response depends heavily on manual investigation.');
 else openSheet('With ATHAR','Continuous trust scoring, anomaly detection, policy-based containment, MITRE ATT&CK ICS classification, accountable human recovery decisions, and a traceable digital evidence chain.');
}
